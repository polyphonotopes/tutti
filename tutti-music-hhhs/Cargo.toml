[package]
name = "tutti-music-hhhs"
version = "0.4.4"
edition = "2024"
rust-version = "1.95"
description = "Capability-native HHHS Replica protocol for tutti-music"
license = "MIT OR Apache-2.0"

[dependencies]
tutti-music = { path = "../tutti-music" }
hhhs = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-cap = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-proof = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-replica = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-session = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-store = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
blake3 = "=1.8.5"
futures = "0.3"
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be", features = ["driver"] }
hhhs-session = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "a33046622a02e892f2bfee49604ad332956ed3be", features = ["replica", "xchacha20poly1305"] }
