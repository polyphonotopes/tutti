[package]
name = "tutti-music-hhhs"
version = "0.4.2"
edition = "2024"
rust-version = "1.97.1"
description = "Capability-native HHHS Replica protocol for tutti-music"
license = "MIT OR Apache-2.0"

[dependencies]
tutti-music = { path = "../tutti-music" }
hhhs = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "eba76d3" }
hhhs-cap = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "eba76d3" }
hhhs-proof = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "eba76d3" }
hhhs-replica = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "eba76d3" }
hhhs-store = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "eba76d3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
