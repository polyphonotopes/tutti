[package]
name = "tutti-music"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[features]
default = []
# Bounded compatibility island for tutti's pre-Replica source-log consumers.
# Capability-native peers use only the protocol vocabulary and never resolve
# p2panda, the old HHHS git revision, or `tutti-core`.
legacy-source-log = ["dep:tutti-core"]

[dependencies]
tutti-core = { path = "../tutti-core", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# TuningId — blake3 of the canonical tuning bytes. Pinned to walkie's exact rev so
# tuning identities unify across the workspace.
blake3 = "=1.8.5"

# The reference-oracle surface (`Store::view_reference`) for the convergence and
# compaction-equivalence suites — dev-only, production never names `hhhs`.
[dev-dependencies]
tutti-core = { path = "../tutti-core", features = ["test-support"] }

[[test]]
name = "convergence"
required-features = ["legacy-source-log"]

[[test]]
name = "retain_equiv"
required-features = ["legacy-source-log"]
