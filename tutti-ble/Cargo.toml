[package]
name = "tutti-ble"
version = "0.4.4"
edition = "2024"
rust-version = "1.95"
description = "Bounded BLE GATT link framing and HHHS carrier adapter for Tutti"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "=1.8.5"
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "4344742c69b868e9df4005eeab23fa101fdd48fc", features = ["driver"] }
thiserror = "2.0"
tutti-session = { path = "../tutti-session" }

[dev-dependencies]
ed25519-dalek = "3"
futures = "0.3"
