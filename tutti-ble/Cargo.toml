[package]
name = "tutti-ble"
version = "0.4.4"
edition = "2024"
rust-version = "1.95"
description = "Bounded BLE GATT link framing and HHHS carrier adapter for Tutti"
license = "MIT OR Apache-2.0"

[dependencies]
hhhs-sync = { version = "0.4.5", git = "https://gitlab.com/micahscopes/hhhs-rs.git", rev = "332ae1b5c5059a844cd468e52c8f6a3e5b0e9b55", features = ["driver"] }
thiserror = "2.0"
tutti-session = { path = "../tutti-session" }

[dev-dependencies]
ed25519-dalek = "3"
futures = "0.3"
