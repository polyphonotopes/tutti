[package]
name = "tutti-amy"
version = "0.1.0"
edition = "2021"
description = "Stage 1 of the tutti/AMY ESP32 grand challenge: drive the AMY C synthesizer from Rust on the desktop, and project a tutti pitch-set into AMY wire events."
publish = false

# Deliberately not a default workspace member: the AMY leaf links a C synth and
# is verified independently so ordinary Tutti consumers do not need a C toolchain.

[lib]
name = "tutti_amy"
path = "src/lib.rs"

[[bin]]
name = "render-proof"
path = "src/main.rs"

[dependencies]
futures = "0.3"
hhhs = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-proof = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-replica = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-store = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
hhhs-sync = { version = "0.4.4", git = "https://gitlab.com/micahscopes/hhhs-rs.git", tag = "v0.4.4" }
# The render protocol and its capability-native HHHS Replica seam. AMY owns no
# alternate source log, materializer, or network runtime.
tutti-music = { path = "../tutti-music" }
tutti-music-hhhs = { path = "../tutti-music-hhhs" }
tutti-amy-wire = { path = "../tutti-amy-wire" }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
cc = "1"
