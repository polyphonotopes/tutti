[package]
name = "tutti-amy"
version = "0.1.0"
edition = "2021"
description = "Stage 1 of the tutti/AMY ESP32 grand challenge: drive the AMY C synthesizer from Rust on the desktop, and project a tutti pitch-set into AMY wire events."
publish = false

# Deliberately NOT a walkie workspace member — excluded in the root Cargo.toml,
# like `relay/`, so walkie's normal build/CI never pulls the C toolchain.

[lib]
name = "tutti_amy"
path = "src/lib.rs"

[[bin]]
name = "render-proof"
path = "src/main.rs"

[dependencies]
# The REAL tutti substrate: a generic reconciling signed-op store over an hhhs
# causal op-DAG. `test-support` exposes `Store::view_reference` (drive the SAME
# fold on the kernel ReachIndex) so convergence can be checked against the oracle.
# NOT enabling `merkle`, matching the leaf profile (drops radix_immutable).
tutti-core = { path = "../tutti-core", features = ["test-support"] }
# The music protocol: MusicOp/MusicLang, tuning identity, the facet types, and
# the render seam this crate compiles to AMY wire strings.
tutti-music = { path = "../tutti-music" }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
cc = "1"
